[package]
name = "wealthfront-cli"
version = "0.3.3"
edition = "2021"
rust-version = "1.89"
description = "Read Wealthfront accounts, activity, and documents from the command line, plus an offline importer for the activity CSV export. Keychain-secured, agent-friendly."
license = "MIT"
repository = "https://github.com/piekstra/wealthfront-cli"
homepage = "https://github.com/piekstra/wealthfront-cli"
readme = "README.md"
keywords = ["wealthfront", "investing", "finance", "csv", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "wfr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0" }
pk-cli-utility = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0" }
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0" }
# `wfr mcp`: the MCP profile's tools over the same commands (DESIGN.md §1.9).
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0", features = ["stdio"] }
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
# Already in the tree via reqwest; used directly to validate WFR_BASE_URL with
# a real URL parser (a hand-rolled authority split is userinfo-spoofable).
url = "2"

[dev-dependencies]
# The MCP profile's conformance checks, for the tests only.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
# `Captured::for_test` and the other constructors, so the unit tests run the
# browser login's confirm hook on a capture built by hand, and
# `forget_profile_in`, so the logout tests never reach the real profile. The same tag as the
# dependency, so both name one crate; a dev-dependency only, so the binary is
# built without them.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.19.0", features = ["test-util"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
